server:
  port: 18080

spring:
  application:
    name: federation-gateway
  jackson:
    deserialization:
      fail-on-null-for-primitives: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}

federation:
  trino:
    url: ${TRINO_JDBC_URL:jdbc:trino://localhost:8081}
    user: ${TRINO_USER:federation}
    password: ${TRINO_PASSWORD:}
    query-timeout-seconds: 120
    catalog-dir: docker/trino/catalog
    kafka-config-dir: docker/trino/kafka
  cache:
    enabled: true
    ttl-seconds: 30
    max-size: 256
  max-rows: 10000
  ontology-store: ${ONTOLOGY_STORE:data/tdb2}
  repository:
    url: ${FEDERAL_DB_URL:}
    username: ${FEDERAL_DB_USER:}
    password: ${FEDERAL_DB_PASSWORD:}
  security:
    enabled: ${FEDERATION_SECURITY_ENABLED:false}
    tokens:
      demo: ${FEDERATION_DEMO_TOKEN:demo-token}
      reader: ${FEDERATION_READER_TOKEN:reader-token}
    roles:
      demo: QUERY,ADMIN
      reader: QUERY
    # 非空时按用户限制 catalog；示例：reader 仅 mysql_shop。默认空=不启用 ACL。
    catalogs: {}
    jwt:
      issuer-uri: ${FEDERATION_JWT_ISSUER_URI:}
      roles-claim: ${FEDERATION_JWT_ROLES_CLAIM:roles}
  cors:
    allowed-origins: ${FEDERATION_CORS_ORIGINS:http://localhost:5173,http://localhost:18080}
  quota:
    max-requests-per-minute: ${FEDERATION_QUOTA_PER_MINUTE:120}
  llm:
    protocol: ${LLM_PROTOCOL:openai}
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
  ask:
    min-confidence: 0.5
    max-path-depth: 4
    sample-rows: 3
    result-preview-rows: 50
  kafka-mappings: {}
  vector:
    default-k: 10
    milvus-uri: ${MILVUS_URI:}
