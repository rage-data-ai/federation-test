server:
  port: 18080

spring:
  application:
    name: federation-gateway
  jackson:
    deserialization:
      fail-on-null-for-primitives: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

federation:
  trino:
    url: jdbc:trino://localhost:8081
    user: federation
    password: ""
    query-timeout-seconds: 120
    catalog-dir: docker/trino/catalog
    kafka-config-dir: docker/trino/kafka
  cache:
    enabled: true
    ttl-seconds: 30
    max-size: 256
  max-rows: 10000
  ontology-store: data/tdb2
  repository:
    url: jdbc:mysql://192.168.19.70:3308/federal?sslMode=DISABLED&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: ${FEDERAL_DB_USER:tsoc}
    password: ${FEDERAL_DB_PASSWORD:}
  llm:
    protocol: ${LLM_PROTOCOL:openai}
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
  ask:
    min-confidence: 0.5
    max-path-depth: 4
    sample-rows: 3
    result-preview-rows: 50
  kafka-mappings: {}
  vector:
    default-k: 10
    milvus-uri: ""
