services:
  trino:
    image: trinodb/trino:476
    ports:
      - "8081:8080"
    volumes:
      - ./docker/trino/config.properties:/etc/trino/config.properties:ro
      - ./docker/trino/catalog-store.properties:/etc/trino/catalog-store.properties:ro
      - ./docker/trino/catalog:/etc/trino/catalog
      - ./docker/trino/kafka:/etc/trino/kafka
