# 一键全家桶：依赖（MySQL + Trino + Milvus）+ 网关（内嵌控制台静态资源）
# 用法：docker compose up -d --build
# 控制台：http://localhost:18080
#
# 仅起依赖、本机跑网关/前端：见 docker-compose.deps.yml

include:
  - path: docker-compose.deps.yml

services:
  gateway:
    build: .
    ports:
      - "18080:18080"
    environment:
      FEDERAL_DB_URL: jdbc:mysql://mysql:3306/federal?sslMode=DISABLED&allowPublicKeyRetrieval=true&characterEncoding=utf8
      FEDERAL_DB_USER: federation
      FEDERAL_DB_PASSWORD: federation
      TRINO_JDBC_URL: jdbc:trino://trino:8080
      TRINO_USER: federation
      MILVUS_URI: http://milvus:19530
      FEDERATION_CORS_ORIGINS: "http://localhost:18080,http://localhost:5173,http://127.0.0.1:18080,http://127.0.0.1:5173"
      # 可选：跳过控制台首次管理员向导
      # FEDERATION_ADMIN_USER: admin
      # FEDERATION_ADMIN_PASSWORD: change-me-now
    volumes:
      - ./docker/trino/catalog:/app/docker/trino/catalog
      - ./docker/trino/kafka:/app/docker/trino/kafka
      - gateway-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      trino:
        condition: service_healthy
      milvus:
        condition: service_healthy

volumes:
  gateway-data:
