name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  backend:
    # Pin LTS image: ubuntu-latest drifted to 26.04 and broke some tooling.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit tests, Testcontainers IT, and quality gates
        # ubuntu-latest 提供 Docker，Jdbc*StoreIT 会真实跑 MySQL 容器（本地无 Docker 时自动跳过）
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: mvn -B verify

  frontend:
    # Playwright 1.56 does not support ubuntu-26.04 (ubuntu-latest as of 2026-11).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke and visual baselines
        run: npm run test:e2e
        env:
          CI: true
