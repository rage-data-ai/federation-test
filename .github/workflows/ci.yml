name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit tests, Testcontainers IT, and quality gates
        # ubuntu-latest 提供 Docker，Jdbc*StoreIT 会真实跑 MySQL 容器（本地无 Docker 时自动跳过）
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
